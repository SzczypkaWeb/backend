version: 2

updates:
  # target-branch: staging, not main - dependency bumps go through the same
  # staging validation (deploy + e2e) as any other change before promotion,
  # same reasoning as orchestrator/repos.py's target_branch (see RUNBOOK.md
  # section 4).
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"

  # Bumps action versions used in workflow YAML (e.g. actions/checkout@vX) -
  # cheap and safe to automate, easy to forget by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
