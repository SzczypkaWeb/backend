name: Dependabot auto-merge

# Only patch/minor version bumps get auto-merged, and only after this repo's
# normal CI checks pass (branch protection still gates the actual merge -
# this just clicks "merge" for you instead of you doing it by hand). Major
# bumps are deliberately excluded: a major version bump is exactly what
# shipped the @nestjs/swagger v12-on-Nest-11 incident (see BLOG_NOTES.md) -
# those still need a human to actually look at the changelog.
on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for patch/minor bumps
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
