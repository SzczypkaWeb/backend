name: Deploy to Cloud Run (staging)

# Separate file (not a job in deploy-gcp.yml) on purpose - the production
# deploy on push to `main` should have zero risk of regressions from changes
# here. Deploys to a SEPARATE Cloud Run service (`backend-staging`), so no
# revision/traffic split ever touches the prod service (`backend`).
on:
  push:
    branches: [staging]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      FRONTEND_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm exec jest --runInBand

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Leaves room for "required reviewers"/protection rules in GitHub
    # Environments independently of production - see Settings -> Environments.
    # Runtime secrets (DATABASE_URL_STAGING etc.) still live in GCP Secret
    # Manager either way, not in this Environment - `environment:` here is a
    # control point over the WORKFLOW ITSELF (who can run/approve it), not
    # over the data.
    environment: staging
    # Job-level output has to be declared explicitly - it doesn't propagate
    # automatically from `steps.deploy.outputs.url` to other jobs without this.
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/416578348143/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-backend-deploy@szczypka-web-backend.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Same mechanism as deploy-gcp.yml (production) - migrations BEFORE the
      # new code deploys, against the SEPARATE staging database. Will fail
      # with "secret not found" until DATABASE_URL_STAGING exists in GCP
      # Secret Manager (see the NOTE on the "Deploy to Cloud Run (staging)"
      # step below) - that's the intended behavior, not a bug.
      - name: Fetch DATABASE_URL_STAGING for migrations
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL_STAGING)"
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      - name: Run database migrations (staging)
        run: pnpm exec prisma migrate deploy

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-central2-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # No `:latest` tag - that tag is meant to mean "current prod" without
      # ambiguity, the staging image is referenced by gcloud run deploy below
      # exclusively by its SHA tag.
      - name: Build and push image (amd64 — required by Cloud Run)
        env:
          IMAGE: europe-central2-docker.pkg.dev/szczypka-web-backend/backend/api
        run: |
          docker buildx build --platform linux/amd64 \
            -t $IMAGE:staging-${{ github.sha }} \
            --push .

      # NOTE: requires the _STAGING-suffixed secrets to already exist in GCP
      # Secret Manager, created manually beforehand (DATABASE_URL_STAGING
      # pointing at a SEPARATE Supabase project/database, not production -
      # see DECISIONS.md in infra/ about the cost of a second free Supabase
      # project). Until they're created, this step fails with "secret not
      # found" - that's intended, there's no safe fallback to production
      # secrets.
      - name: Deploy to Cloud Run (staging)
        id: deploy
        run: |
          URL=$(gcloud run deploy backend-staging \
            --image=europe-central2-docker.pkg.dev/szczypka-web-backend/backend/api:staging-${{ github.sha }} \
            --region=europe-central2 \
            --allow-unauthenticated \
            --port=3000 \
            --set-secrets="DATABASE_URL=DATABASE_URL_STAGING:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID_STAGING:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET_STAGING:latest,GOOGLE_CALLBACK_URL=GOOGLE_CALLBACK_URL_STAGING:latest,FRONTEND_ORIGIN=FRONTEND_ORIGIN_STAGING:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET_STAGING:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET_STAGING:latest,SENTRY_DSN=SENTRY_DSN_STAGING:latest" \
            --set-env-vars="JWT_ACCESS_EXPIRES=900,JWT_REFRESH_EXPIRES=604800" \
            --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  # #45 done: react-app and frontend-shell now have their own staging deploys
  # (push to `staging`, a persistent named environment on the same SWA
  # resource - see their workflows). `app_url` below points at
  # frontend-shell's staging URL instead of the placeholder from
  # e2e-tests/.github/workflows/e2e.yml.
  #
  # Requires setting up in this repo's (backend) Settings before it actually
  # works:
  #   Variables: FRONTEND_SHELL_STAGING_URL
  #   Secrets:   E2E_DATABASE_URL_STAGING (the same database as
  #              DATABASE_URL_STAGING above) - without it, the `app` project
  #              in e2e-tests is safely skipped (marketing+flows still run),
  #              the job doesn't fail.
  #              E2E_REPO_PAT (required - fine-grained PAT, Contents:
  #              Read-only on marketplace-e2e; needed because the ambient
  #              GITHUB_TOKEN in this run can't check out that repo's own
  #              code, even though Actions -> Access below permits the
  #              workflow_call itself - two separate permissions)
  #
  # Requires: e2e-tests (marketplace-e2e) must have Settings -> Actions ->
  # Access allowing access from repos in this organization ("Accessible from
  # repositories in the 'szczypkaweb' organization") - otherwise this
  # reusable-workflow call from another repo gets a 404/permission error,
  # even with a valid GITHUB_TOKEN.
  e2e:
    needs: deploy
    uses: szczypkaweb/marketplace-e2e/.github/workflows/e2e.yml@main
    with:
      api_url: ${{ needs.deploy.outputs.backend_url }}
      app_url: ${{ vars.FRONTEND_SHELL_STAGING_URL }}
    secrets:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL_STAGING }}
      E2E_REPO_CHECKOUT_TOKEN: ${{ secrets.E2E_REPO_PAT }}

  promote-to-main:
    needs: e2e
    if: needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Placeholder - a one-click promote, not an auto-merge. Replace with a
      # real staging -> main PR open/merge (e.g. `gh pr create --base main
      # --head staging --fill` + optionally `gh pr merge --auto`) once backend
      # has branch protection and it's clear whether promote should be fully
      # automatic.
      - run: echo "e2e passed on staging - ready to promote staging -> main."
