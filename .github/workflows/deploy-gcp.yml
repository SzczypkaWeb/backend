name: Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      FRONTEND_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm exec jest --runInBand

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # GitHub Environment "production" - lets Settings -> Environments hold a
    # required-reviewers protection rule (manual approval gate before this
    # runs) independently of staging (see deploy-gcp-staging.yml). Runtime
    # secrets still come from GCP Secret Manager via --set-secrets below, not
    # from this Environment's own secrets.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/416578348143/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-backend-deploy@szczypka-web-backend.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Migracje ZANIM nowy kod się wdroży (nie równolegle, nie po) - kod z
      # tego SHA może już zakładać nowy schemat. Odpalane wprost z runnera
      # przeciw prawdziwej produkcyjnej bazie, PRZED podmianą rewizji Cloud
      # Run - jeśli to się wywali, deploy się w ogóle nie zaczyna (patrz
      # RUNBOOK.md sekcja 7.3 - to nie jest to samo co rollback bazy, tylko
      # zapobiega wdrożeniu kodu niezgodnego ze stanem bazy).
      #
      # UWAGA: wymaga, żeby github-actions-backend-deploy@ (service account
      # WIF użyty w tym workflow) miał rolę roles/secretmanager.secretAccessor
      # na sekrecie DATABASE_URL - deploy Cloud Run tego dotąd nie wymagał
      # (--set-secrets tylko referencjonuje sekret po nazwie, nie czyta go
      # bezpośrednio), więc to może być dodatkowe uprawnienie do nadania
      # ręcznie w GCP IAM, jeśli ten krok padnie na "Permission denied".
      # $GITHUB_ENV (nie step output) celowo - sekret w step output przeżywa
      # w danych przebiegu/UI dłużej niż potrzeba; jako env var zmiennej
      # środowiskowej istnieje tylko w kolejnych krokach TEGO joba.
      - name: Fetch DATABASE_URL for migrations
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL)"
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-central2-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (amd64 — wymagane przez Cloud Run)
        env:
          IMAGE: europe-central2-docker.pkg.dev/szczypka-web-backend/backend/api
        run: |
          docker buildx build --platform linux/amd64 \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend \
            --image=europe-central2-docker.pkg.dev/szczypka-web-backend/backend/api:${{ github.sha }} \
            --region=europe-central2 \
            --allow-unauthenticated \
            --port=3000 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_CALLBACK_URL=GOOGLE_CALLBACK_URL:latest,FRONTEND_ORIGIN=FRONTEND_ORIGIN:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,SENTRY_DSN=SENTRY_DSN:latest" \
            --set-env-vars="JWT_ACCESS_EXPIRES=900,JWT_REFRESH_EXPIRES=604800"