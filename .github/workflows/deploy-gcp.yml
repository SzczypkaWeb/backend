name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  # Runs the same `test` job as a required PR check (branch protection) -
  # previously this workflow only ran on push, so lint/jest only caught
  # problems AFTER merging to main, not before. `deploy` stays gated to
  # `push` only below, so a PR never attempts a real Cloud Run deploy.
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
      FRONTEND_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm exec jest --runInBand

  deploy:
    needs: test
    # Only a real push to main triggers a deploy - the `pull_request` trigger
    # above exists solely to run `test` as a required status check; without
    # this guard a PR run would also try (and fail, lacking OIDC trust for
    # a PR ref) to authenticate to GCP and deploy.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # GitHub Environment "production" - lets Settings -> Environments hold a
    # required-reviewers protection rule (manual approval gate before this
    # runs) independently of staging (see deploy-gcp-staging.yml). Runtime
    # secrets still come from GCP Secret Manager via --set-secrets below, not
    # from this Environment's own secrets.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/416578348143/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-backend-deploy@szczypka-web-backend.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Migrations BEFORE the new code deploys (not in parallel, not after) -
      # code at this SHA may already assume the new schema. Run straight from
      # the runner against the real production database, BEFORE the Cloud Run
      # revision is swapped - if this fails, the deploy doesn't even start
      # (see RUNBOOK.md section 7.3 - this isn't the same as a database
      # rollback, it just prevents deploying code that's incompatible with
      # the database's current state).
      #
      # NOTE: requires github-actions-backend-deploy@ (the WIF service
      # account used in this workflow) to have the
      # roles/secretmanager.secretAccessor role on the DATABASE_URL secret -
      # Cloud Run deploy hasn't needed this so far (--set-secrets only
      # references the secret by name, doesn't read it directly), so this may
      # be an extra permission to grant manually in GCP IAM if this step
      # fails with "Permission denied".
      # $GITHUB_ENV (not a step output) on purpose - a secret in a step
      # output lives in the run's data/UI longer than necessary; as an env
      # var it only exists in later steps of THIS job.
      - name: Fetch DATABASE_URL for migrations
        run: |
          DATABASE_URL="$(gcloud secrets versions access latest --secret=DATABASE_URL)"
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma migrate deploy

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-central2-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image (amd64 — required by Cloud Run)
        env:
          IMAGE: europe-central2-docker.pkg.dev/szczypka-web-backend/backend/api
        run: |
          docker buildx build --platform linux/amd64 \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy backend \
            --image=europe-central2-docker.pkg.dev/szczypka-web-backend/backend/api:${{ github.sha }} \
            --region=europe-central2 \
            --allow-unauthenticated \
            --port=3000 \
            --set-secrets="DATABASE_URL=DATABASE_URL:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,GOOGLE_CALLBACK_URL=GOOGLE_CALLBACK_URL:latest,FRONTEND_ORIGIN=FRONTEND_ORIGIN:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest,SENTRY_DSN=SENTRY_DSN:latest" \
            --set-env-vars="JWT_ACCESS_EXPIRES=900,JWT_REFRESH_EXPIRES=604800"