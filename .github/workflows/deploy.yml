name: Deploy to ECS

on:
  workflow_dispatch: #AWS Disabled after migration to GCP, check DECISIONS.md

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # generated/ (the Prisma Client output) is gitignored and must be
      # (re)built from prisma/schema.prisma before lint/test, otherwise
      # generated types drift out of sync with the schema (see the
      # `generated Prisma client / schema.prisma sync` spec in
      # src/listings) and `../../generated/prisma/client` fails to resolve
      # on a clean checkout.
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-backend-deploy
          aws-region: eu-central-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image (ARM64 — dopasowane do task definition!)
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: szczypka-web-backend
        run: |
          docker buildx build --platform linux/arm64 \
            -t $REGISTRY/$REPOSITORY:${{ github.sha }} \
            -t $REGISTRY/$REPOSITORY:latest \
            --push .

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster szczypka-web-cluster \
            --service szczypka-web-backend-service \
            --force-new-deployment \
            --region eu-central-1